<div class="shell" [class.shell--collapsed]="collapsed()" [class.shell--mobile-open]="mobileOpen()">
  <aside id="app-sidebar" class="shell__sidebar" [class.shell__sidebar--open]="mobileOpen()">
    <a class="brand" routerLink="/dashboard">
      <img
        class="brand__logo"
        src="/assets/brand/logo-dgi.png"
        alt="Direction Générale des Impôts de Côte d'Ivoire"
      />
      <span class="brand__text">PDREF<span>DGI</span></span>
    </a>

    <nav class="nav" aria-label="Navigation principale">
      <ul>
        @for (item of navigation(); track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              (click)="closeMobile()"
            >
              <pdref-icon [name]="item.icon" />
              <span class="nav__label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>

  @if (mobileOpen()) {
    <button
      type="button"
      class="shell__backdrop"
      aria-label="Fermer la navigation"
      (click)="closeMobile()"
    ></button>
  }

  <div class="shell__main">
    <header class="topbar">
      <button
        type="button"
        class="pd-icon-btn"
        [attr.aria-label]="
          mobileOpen()
            ? 'Fermer la navigation'
            : collapsed()
              ? 'Deplier la navigation'
              : 'Reduire la navigation'
        "
        aria-controls="app-sidebar"
        [attr.aria-expanded]="sidebarExpanded()"
        (click)="toggleSidebar()"
      >
        <pdref-icon name="menu" />
      </button>

      <pdref-breadcrumb [items]="breadcrumbs.items()" />

      <div class="topbar__actions">
        <pdref-theme-toggle />
        <pdref-notification-center />
        @if (user(); as currentUser) {
          <span class="topbar__user">
            <pdref-icon name="user" size="sm" />
            <span class="topbar__user-name">{{ currentUser.displayName }}</span>
          </span>
          <button type="button" class="pd-icon-btn" aria-label="Se deconnecter" (click)="logout()">
            <pdref-icon name="logout" />
          </button>
        }
      </div>
    </header>

    <main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>

    <footer class="shell__footer">
      <span>Direction Generale des Impots</span>
      <span class="pd-muted">Cote d'Ivoire</span>
    </footer>
  </div>
</div>
